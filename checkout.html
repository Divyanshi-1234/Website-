<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>


<body>
    <div class="checkout-navbar">
        <img src="images/navlogo.png" alt="Ayurveda" class="checkout-logo">
    </div>
    <div class="container checkout-page">
        <div class="row g-4">
            <div class="col-lg-7">
                <div class="checkout-box">
                    <div class="customer-top">
                        <h4>
                            Customer information
                        </h4>
                        <p class="login-text">
                            Already have an account?
                            <a href="#">
                                Log in
                            </a>
                        </p>
                    </div>


                    <div class="checkout-field">
                        <input type="text" id="usernameEmail" placeholder="Username or Email Address *">
                    </div>

                    <h4 class="billing-title">
                        Billing details
                    </h4>

                    <form id="checkoutForm" novalidate>
                        <div class="row">
                            <div class="col-md-6">
                                <div class="checkout-field">
                                    <input type="text" id="firstName" placeholder="First name *" required>

                                </div>
                            </div>


                            <div class="col-md-6">
                                <div class="checkout-field">
                                    <input type="text" id="lastName" placeholder="Last name *" required>
                                </div>
                            </div>
                        </div>


                        <div class="checkout-field">
                            <input type="text" id="company" placeholder="Company name">
                        </div>


                        <div class="checkout-field">
                            <select id="country" required>
                                <option value="India" selected>
                                    India
                                </option>
                            </select>
                        </div>


                        <div class="row">
                            <div class="col-md-6">
                                <div class="checkout-field">
                                    <input type="text" id="address" placeholder="Street address *" required>

                                </div>
                            </div>


                            <div class="col-md-6">
                                <div class="checkout-field">
                                    <input type="text" id="apartment"
                                        placeholder="Apartment, suite, unit, etc. (optional)">

                                </div>
                            </div>
                        </div>


                        <div class="row">
                            <div class="col-md-4">
                                <div class="checkout-field">
                                    <input type="text" id="city" placeholder="Town / City *" required>
                                </div>
                            </div>


                            <div class="col-md-4">
                                <div class="checkout-field">
                                    <select id="state" required>
                                        <option value="">
                                            State
                                        </option>
                                    </select>
                                </div>
                            </div>


                            <div class="col-md-4">
                                <div class="checkout-field">

                                    <input type="text" id="pincode" placeholder="PIN Code *" required>

                                </div>
                            </div>
                        </div>


                        <div class="checkout-field">
                            <input type="tel" id="phone" placeholder="Phone *" required>
                        </div>


                        <div class="checkout-field">

                            <input type="email" id="email" placeholder="Email address *" required>

                        </div>


                        <label class="different-address">
                            <input type="checkbox" id="differentAddress">
                            Ship to a different address?

                        </label>


                        <div id="differentAddressBox">
                            <div class="shipping-fields">
                                <div class="row">
                                    <div class="col-md-6">
                                        <div class="checkout-field">
                                            <input type="text" id="shippingFirstName" placeholder="First name *">
                                        </div>
                                    </div>


                                    <div class="col-md-6">
                                        <div class="checkout-field">
                                            <input type="text" id="shippingLastName" placeholder="Last name *">
                                        </div>
                                    </div>
                                </div>


                                <div class="checkout-field">
                                    <input type="text" id="shippingCompany" placeholder="Company name">
                                </div>


                                <div class="checkout-field">
                                    <select id="shippingCountry">

                                        <option value="India" selected>
                                            India
                                        </option>

                                        <option value="">
                                            Select a country / region...
                                        </option>
                                    </select>
                                </div>


                                <div class="row">
                                    <div class="col-md-6">
                                        <div class="checkout-field">
                                            <input type="text" id="shippingAddress" placeholder="Street address *">
                                        </div>
                                    </div>


                                    <div class="col-md-6">
                                        <div class="checkout-field">
                                            <input type="text" id="shippingApartment"
                                                placeholder="Apartment, suite, unit, etc. (optional)">

                                        </div>
                                    </div>
                                </div>


                                <div class="row">
                                    <div class="col-md-4">
                                        <div class="checkout-field">
                                            <input type="text" id="shippingCity" placeholder="Town / City *">
                                        </div>

                                    </div>


                                    <div class="col-md-4">
                                        <div class="checkout-field">
                                            <select id="shippingState">
                                                <option value="">
                                                    State
                                                </option>
                                                <option>
                                                    Andaman and Nicobar Islands
                                                </option>

                                                <option>
                                                    Andhra Pradesh
                                                </option>

                                                <option>
                                                    Arunachal Pradesh
                                                </option>

                                                <option>
                                                    Assam
                                                </option>

                                                <option>
                                                    Bihar
                                                </option>

                                                <option>
                                                    Delhi
                                                </option>

                                                <option>
                                                    Gujarat
                                                </option>

                                                <option>
                                                    Haryana
                                                </option>

                                                <option>
                                                    Himachal Pradesh
                                                </option>

                                                <option>
                                                    Jammu and Kashmir
                                                </option>

                                                <option>
                                                    Jharkhand
                                                </option>

                                                <option>
                                                    Karnataka
                                                </option>

                                                <option>
                                                    Kerala
                                                </option>

                                                <option>
                                                    Madhya Pradesh
                                                </option>

                                                <option>
                                                    Maharashtra
                                                </option>

                                                <option>
                                                    Rajasthan
                                                </option>

                                                <option>
                                                    Tamil Nadu
                                                </option>

                                                <option>
                                                    Uttar Pradesh
                                                </option>

                                              

                                            </select>

                                        </div>

                                    </div>


                                    <div class="col-md-4">

                                        <div class="checkout-field">

                                            <input type="text" id="shippingPincode" placeholder="PIN Code *">

                                        </div>

                                    </div>

                                </div>


                                <div class="checkout-field shipping-notes">

                                    <textarea id="shippingNotes"
                                        placeholder="Notes about your order, e.g. special notes for delivery."></textarea>

                                </div>


                                <p class="coupon-text">
                                    Have a coupon?
                                </p>


                            </div>

                        </div>


                        <h4 class="payment-title">
                            Payment
                        </h4>


                        <div class="payment-option">

                            <label>

                                <input type="radio" name="payment" value="cod" checked>

                                <strong>
                                    Cash on delivery
                                </strong>

                            </label>


                            <p class="payment-description">
                                Pay with cash upon delivery.
                            </p>

                        </div>


                        <div class="payment-option">

                            <label>

                                <input type="radio" name="payment" value="paypal">

                                <strong>
                                    PayPal
                                </strong>

                            </label>

                        </div>


                        <button type="submit" class="place-order-btn">

                            Place Order ₹<span id="placeOrderTotal">0.00</span>

                        </button>


                    </form>

                </div>

            </div>


            <div class="col-lg-5">

                <div class="checkout-box order-box">

                    <h4>
                        Your order
                    </h4>


                    <div class="order-header">

                        <span>
                            Product
                        </span>

                        <span>
                            Subtotal
                        </span>

                    </div>


                    <div id="checkoutItems">
                    </div>


                    <div class="order-row">

                        <strong>
                            Subtotal
                        </strong>

                        <strong>
                            ₹<span id="checkoutSubtotal">0.00</span>
                        </strong>

                    </div>


                    <div class="order-row">

                        <strong>
                            Shipment
                        </strong>

                        <span class="shipment-text">
                            Flat rate: ₹8.00
                        </span>

                    </div>


                    <div class="checkout-total">

                        <span>
                            Total
                        </span>

                        <span>
                            ₹<span id="checkoutTotal">0.00</span>
                        </span>

                    </div>

                </div>

            </div>


        </div>

    </div>


    <div class="card text-center">

        <div class="card-body social-iconstext-light">

            <div class="social-icons">

                <a href="#top">
                    <i class="fa-brands fa-facebook-f"></i>
                </a>

                <a href="#top">
                    <i class="fa-brands fa-twitter"></i>
                </a>

                <a href="#top">
                    <i class="fa-brands fa-instagram"></i>
                </a>

                <a href="#top">
                    <i class="fa-brands fa-youtube"></i>
                </a>

            </div>

            <p class="card-text">

                Copyright © 2026 Ayurveda |
                Powered by Ayurveda

            </p>

        </div>

    </div>


    <script>

        let cart =
            JSON.parse(localStorage.getItem("cart")) || [];


        let checkoutItems =
            document.getElementById("checkoutItems");


        let checkoutSubtotal =
            document.getElementById("checkoutSubtotal");


        let checkoutTotal =
            document.getElementById("checkoutTotal");


        let placeOrderTotal =
            document.getElementById("placeOrderTotal");


        let shipping = 8;


        const countries = [

            "Afghanistan",
            "Åland Islands",
            "Albania",
            "Algeria",
            "American Samoa",
            "Andorra",
            "Angola",
            "Bangladesh",
            "Barbados",
            "Belarus",
            "Belgium",
            "Belize",
            "Benin",
            "Bermuda",
            "Bhutan",
            "Bolivia"

        ];


        let countrySelect =
            document.getElementById("country");


        countries.forEach(function (country) {

            if (country === "India") {
                return;
            }

            let option =
                document.createElement("option");

            option.value = country;

            option.innerText = country;

            countrySelect.appendChild(option);

        });


        const states = [

            "Andaman and Nicobar Islands",
            "Andhra Pradesh",
            "Arunachal Pradesh",
            "Assam",
            "Bihar",
            "Chandigarh",
            "Chhattisgarh",
            "Dadra and Nagar Haveli and Daman and Diu",
            "Delhi",
            "Goa",
            "Gujarat",
            "Haryana",
            "Himachal Pradesh",
            "Jammu and Kashmir",
            "West Bengal"

        ];


        let stateSelect =
            document.getElementById("state");


        states.forEach(function (state) {

            let option =
                document.createElement("option");

            option.value = state;

            option.innerText = state;

            stateSelect.appendChild(option);

        });


        let differentAddress =
            document.getElementById("differentAddress");


        let differentAddressBox =
            document.getElementById("differentAddressBox");


        differentAddress.addEventListener("change", function () {

            if (this.checked) {

                differentAddressBox.style.display = "block";

            } else {

                differentAddressBox.style.display = "none";

            }

        });


        let subtotal = 0;


        if (cart.length === 0) {

            checkoutItems.innerHTML = `

                <div class="empty-cart">

                    <p>
                        Your cart is empty.
                    </p>

                    <a href="Shop.html">
                        Continue Shopping
                    </a>

                </div>

            `;

        } else {

            cart.forEach(function (item) {

                let quantity =
                    Number(item.quantity) || 1;


                let price =
                    Number(item.price) || 0;


                let itemTotal =
                    price * quantity;


                subtotal += itemTotal;


                checkoutItems.innerHTML += `

                    <div class="order-item">

                        <img src="${item.image}"
                             alt="${item.name}">

                        <div class="order-item-details">

                            <h6>
                                ${item.name}
                            </h6>

                            <p>

                                ₹${price.toFixed(2)}

                                &nbsp; × &nbsp;

                                ${quantity}

                            </p>

                        </div>

                        <div class="order-price">

                            ₹${itemTotal.toFixed(2)}

                        </div>

                    </div>

                `;

            });

        }


        let total = subtotal;


        if (cart.length > 0) {

            total =
                subtotal + shipping;

        }


        checkoutSubtotal.innerText =
            subtotal.toFixed(2);


        checkoutTotal.innerText =
            total.toFixed(2);


        placeOrderTotal.innerText =
            total.toFixed(2);


        document.getElementById("checkoutForm")
            .addEventListener("submit", function (event) {

                event.preventDefault();


                /* CHECK CART FIRST */

                if (cart.length === 0) {

                    alert("Your cart is empty!");

                    return;

                }


                /* CHECK CUSTOMER INFORMATION */

                let usernameEmail =
                    document.getElementById("usernameEmail");


                /* CHECK BILLING FIELDS */

                let requiredFields = [

                    usernameEmail,

                    document.getElementById("firstName"),

                    document.getElementById("lastName"),

                    document.getElementById("country"),

                    document.getElementById("address"),

                    document.getElementById("city"),

                    document.getElementById("state"),

                    document.getElementById("pincode"),

                    document.getElementById("phone"),

                    document.getElementById("email")

                ];


                let allFieldsFilled = true;


                requiredFields.forEach(function (field) {

                    if (field.value.trim() === "") {

                        allFieldsFilled = false;

                    }

                });


                /* CHECK DIFFERENT SHIPPING ADDRESS */

                if (differentAddress.checked) {

                    let shippingRequiredFields = [

                        document.getElementById("shippingFirstName"),

                        document.getElementById("shippingLastName"),

                        document.getElementById("shippingAddress"),

                        document.getElementById("shippingCity"),

                        document.getElementById("shippingState"),

                        document.getElementById("shippingPincode")

                    ];


                    shippingRequiredFields.forEach(function (field) {

                        if (field.value.trim() === "") {

                            allFieldsFilled = false;

                        }

                    });

                }


                /* SHOW REQUIRED FIELD ALERT */

                if (!allFieldsFilled) {

                    alert("All fields are required to fill.");

                    return;

                }


                /* ORDER SUCCESS */

                alert("Order placed successfully!");


                localStorage.removeItem("cart");


                window.location.href =
                    "home.html";

            });

    </script>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>


</body>

</html>
